function load(){try{let d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.products)&&Array.isArray(d.orders)){for(let p of d.products){let demo=sample.find(x=>x.id===p.id);if(demo && (String(p.image||'').includes('images.unsplash.com')||String(p.image||'').startsWith('data:image/png;base64,'))){p.image=demo.image;p.description=demo.description;}}return {...fresh(),...d}}return fresh()}catch(e){return fresh()}}
let db=load(), view='home',filter='Všetko',adminTab='products',editing=null,selectedProduct=null,custom={type:'Sveter',color:'Krémová',size:'M',material:'Vlna',fit:'Voľný',quantity:1,length:62,sleeve:58,knit:3,neckline:'Okrúhly',closure:'Bez zapínania',texture:'Čistý úplet'};

const comboColors={...colors,...Object.fromEntries(Object.entries(comboPalettes).map(([k,v])=>[k,v[0]]))};

const euro=v=>Number(v||0).toLocaleString('sk-SK',{style:'currency',currency:'EUR',maximumFractionDigits:0});
function save(){localStorage.setItem(KEY,JSON.stringify(db))}function alertToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(window.toastTimeout);window.toastTimeout=setTimeout(()=>t.classList.add('hidden'),3600)}
function go(v){view=v;window.scrollTo({top:0,behavior:'instant'});render()}function nav(){return `<header class="top"><div class="brand" onclick="go('home')">NEPÁR</div><nav class="nav"><button onclick="go('shop')">Dropy</button><button onclick="go('about')">O nás</button><button onclick="go('custom')">Custom</button><button onclick="go('passport')">Pôvod kúsku</button><button onclick="go('admin')">Ateliér ↗</button></nav><div class="mobile-nav"><button onclick="go('shop')">Dropy</button><button onclick="go('custom')">Custom</button><button onclick="go('admin')">Ateliér</button></div><button class="btn secondary small" onclick="go('cart')">Košík <span class="counter">${db.cart.reduce((a,c)=>a+c.quantity,0)}</span></button></header>`}
function foot(){return `<footer class="footer"><div class="brand">NEPÁR</div><div>Ručne. Pomaly. Na Slovensku.</div><div><button onclick="go('shop')">Dropy</button><button onclick="go('custom')">Custom</button><button onclick="go('about')">O nás</button><button onclick="go('admin')">Ateliér</button></div></footer>`}
function photo(p){return p.image?`<img src="${esc(p.image)}" alt="${esc(p.name)}" onerror="this.remove()">`:`<span class="product-fallback">${icons[p.category]||'✦'}</span>`}
function card(p){return `<article class="product"><div class="product-media" onclick="openProduct('${esc(p.id)}')" style="cursor:pointer">${photo(p)}<span class="pill">${p.id.startsWith('p')&&['p1','p2','p3','p4'].includes(p.id)?'VIZUALIZÁCIA':p.stock>0?esc(p.stock)+' ks dostupné':'Vypredané'}</span></div><div class="product-info"><h3>${esc(p.name)}</h3><p>${esc(p.category)} · ${esc(p.color||'Ručná výroba')}</p><div class="product-bottom"><span class="price">${euro(p.price)}</span><button class="btn small" ${p.stock<1?'disabled':''} onclick="addCart('${esc(p.id)}')">${p.stock<1?'Vypredané':'+ Košík'}</button></div></div></article>`}
function productCards(items){return items.length?`<div class="product-grid">${items.map(card).join('')}</div>`:'<div class="empty">Zatiaľ tu nie sú žiadne produkty. Nové kusy pribudnú v ďalšom drope.</div>'}
function home(){return `<section class="hero"><div class="hero-content"><div class="eyebrow">Dvaja tvorcovia · jeden ateliér</div><h1>Nie masovo.<br>Osobne.</h1><p>Limitované pletené a háčkované odevy. Každý kus vzniká v našich rukách a nesie svoj vlastný príbeh.</p><div class="hero-actions"><button class="btn light" onclick="go('shop')">Pozrieť aktuálny drop →</button><button class="btn secondary" style="border-color:white;color:white" onclick="go('custom')">Vyskladať custom kúsok</button></div></div></section><div class="drop-banner">UKÁŽKOVÁ KOLEKCIA · Produktové fotografie sú AI koncepty, nie fotografie hotových výrobkov. Ceny a dostupnosť sú iba demo.</div><div class="features"><div>✳ Iba my dvaja</div><div>◷ Drop každé 2 mesiace</div><div>♧ Overený pôvod materiálov</div><div>◎ Identita každého kusu</div></div><section class="section"><div class="container"><div class="section-head"><div><span class="eyebrow">Práve v ateliéri</span><h2>${esc(db.drop.name)}</h2><p class="muted">${esc(db.drop.desc)}</p></div><button class="btn secondary" onclick="go('shop')">Celý drop →</button></div>${productCards(db.products.slice(0,4))}</div></section><section class="band"><div class="container bandgrid"><div><div class="eyebrow">Každý kus je iný</div><h2>Poznaj svoj kus.</h2><p>Číslo edície, zloženie priadze, pôvod materiálu, meno tvorcu aj čas výroby. Nič netajíme. Každý odev má svoj malý pas.</p><button class="btn light" onclick="go('passport')">Ako funguje pas →</button></div><div class="passport"><div class="eyebrow">PAS KUSU / ukážka</div><h3>NEPÁR / 001</h3><dl><dt>Model</dt><dd>Sveter Oblúk</dd><dt>Edícia</dt><dd>01 / KOREŇ</dd><dt>Poradie</dt><dd>03 / 10</dd><dt>Vytvorili</dt><dd>My dvaja</dd><dt>Materiál</dt><dd>Vlna (overiť zloženie)</dd><dt>Pôvod</dt><dd>Podľa konkrétnej priadze</dd></dl><div class="eyebrow">Jedinečný kúsok. Skutočný príbeh.</div></div></div></section><section class="section"><div class="container storygrid"><div class="story-image" role="img" aria-label="Autorská móda"></div><div><div class="eyebrow">Bez veľkej výroby</div><h2>Dvaja ľudia.<br>Štyri ruky.</h2><p>Každý strih navrhujeme a každý kúsok pletieme či háčkujeme sami. Preto nevyrábame stovky kusov. Vznikajú pomaly a v malých množstvách.</p><p>A ak máš vlastnú predstavu, vytvoríme ju spolu s tebou.</p><button class="btn" onclick="go('custom')">Chcem custom objednávku →</button></div></div></section><section class="newsletter"><div class="container inner"><div><div class="eyebrow">Ďalší drop</div><h3>Nezmeškaj ďalšiu edíciu.</h3><p class="muted">Napíš nám a požiadaj o informácie o ďalšom drope.</p></div><button class="btn" onclick="openContact()">Chcem vedieť ako prvý/á →</button></div></section>`}
function shop(){const cats=['Všetko',...new Set(db.products.map(p=>p.category))];let arr=db.products.filter(p=>filter==='Všetko'||p.category===filter);return `<main class="page"><div class="container"><div class="page-title"><div class="drop-meta">Limitovaná edícia</div><h1>${esc(db.drop.name)}</h1><p class="muted">${esc(db.drop.desc)}</p>${db.drop.date?`<p class="eyebrow">Dátum: ${esc(db.drop.date)}</p>`:''}</div><div class="notice">Toto je ukážkový drop s AI vizualizáciami, nie potvrdená ponuka vyrobených kusov. Fotografie a skladové počty sú ilustračné.</div><div class="filters">${cats.map(c=>`<button class="chip ${c===filter?'active':''}" onclick="setFilter('${esc(c)}')">${esc(c)}</button>`).join('')}</div>${productCards(arr)}<div class="notice">Dostupnosť je v tomto prototype ukladaná len v prehliadači. Pri ostrom predaji bude potrebná online databáza, aby sa zásoby synchronizovali medzi zákazníkmi.</div></div></main>`}
function setFilter(c){filter=c;render()}function addCart(id){const p=db.products.find(p=>p.id===id);if(!p||p.stock<1)return;const item=db.cart.find(c=>c.id===id);if(item&&item.quantity>=p.stock)return alertToast('Viac kusov momentálne nie je dostupných.');if(item)item.quantity++;else db.cart.push({id,quantity:1});save();render();alertToast('Kúsok pridaný do košíka.')}function removeCart(id){db.cart=db.cart.filter(x=>x.id!==id);save();render()}
function detail(){const p=db.products.find(p=>p.id===selectedProduct);if(!p)return shop();return `<main class="page"><div class="container"><div class="page-title"><button class="btn secondary small" onclick="go('shop')">← Späť na drop</button></div><div class="product-detail" style="padding-bottom:80px"><div class="product-media">${photo(p)}</div><div><div class="drop-meta">${esc(p.drop)}</div><h1>${esc(p.name)}</h1><p class="price" style="font-size:30px">${euro(p.price)}</p><p>${esc(p.description)}</p><div class="made-by"><h3>Pas výrobku</h3><p><b>Materiál:</b> ${esc(p.material)}<br><b>Pôvod materiálu:</b> ${esc(p.origin)}<br><b>Vytvoril/a:</b> ${esc(p.maker)}<br><b>Čas výroby:</b> ${esc(p.hours)} hodín<br><b>Farba:</b> ${esc(p.color)}</p></div><p class="muted">${p.stock>0?`Dostupné: ${p.stock} ks`:'Momentálne vypredané'}</p><button class="btn" onclick="addCart('${esc(p.id)}')" ${p.stock<1?'disabled':''}>Pridať do košíka →</button><button class="btn secondary" style="margin-left:8px" onclick="go('custom')">Upraviť na mieru</button></div></div></div></main>`}
function openProduct(id){selectedProduct=id;go('detail')}
function about(){return `<main class="page"><div class="container section storygrid"><div><div class="eyebrow">Naša filozofia</div><h1>My dvaja.<br>Jedna značka.</h1><p>NEPÁR je malé slovenské štúdio pletených a háčkovaných odevov. Každý model osobne navrhujeme a vytvárame. Pracujeme v malých sériách, pretože veríme v módu, ktorá má meno, pôvod a čas.</p><p>Každý drop prináša niekoľko kúskov a každý kus dostáva vlastný pas. Pri custom objednávkach s tebou prejdeme možnosti a finálnu cenu potvrdíme individuálne.</p><button class="btn" onclick="go('custom')">Vytvoriť niečo vlastné</button></div><div class="story-image"></div></div></main>`}
function passport(){return `<main class="page"><div class="container section"><div class="eyebrow">Transparentná výroba</div><h1>Každý kúsok má svoj pôvod.</h1><p style="max-width:730px">Do digitálneho pasu konkrétneho výrobku chceme postupne zaznamenať všetky podstatné údaje — od materiálu až po človeka, ktorý ho vytvoril. Na všitej etikete zostanú povinné informácie o zložení a výrobku; príbehová kartička ich doplní.</p><div style="max-width:580px;margin:40px auto" class="passport"><div class="eyebrow">VZOROVÝ PAS · VÝROBNÉ ÚDAJE SÚ ILUSTRAČNÉ</div><h3>NEPÁR / KUS 004</h3><dl><dt>Drop</dt><dd>01 / KOREŇ</dd><dt>Model</dt><dd>Sveter Oblúk</dd><dt>Číslo kusu</dt><dd>04 / 10</dd><dt>Vlákno</dt><dd>100 % vlna (príklad)</dd><dt>Pôvod vlákna</dt><dd>Slovensko (príklad)</dd><dt>Spracovanie</dt><dd>Doplniť podľa dodávateľa</dd><dt>Vyrobil/a</dt><dd>Meno tvorcu</dd><dt>Čas výroby</dt><dd>22 hodín (príklad)</dd><dt>Starostlivosť</dt><dd>Pokyny podľa priadze</dd></dl></div><p class="note">Reálne pasy musia vychádzať z doložených informácií. QR kódy a verejné stránky jednotlivých kusov možno doplniť po pripojení databázy.</p></div></main>`}
function sizeFactor(size){return ({'XS':.78,'S':.88,'M':1,'L':1.14,'XL':1.30,'Na mieru':1.12}[size]||1)}
const customPrices={'Sveter':240,'Kardigán':280,'Top':130,'Doplnok':70,'Šaty':320,'Iné':150};
const defaultLength={'Sveter':62,'Kardigán':68,'Top':50,'Doplnok':45,'Šaty':100,'Iné':62};
function knitLabel(v){return ({1:'Jemný',2:'Ľahký',3:'Stredný',4:'Hrubší',5:'Chunky'}[+v]||'Stredný')}
function yarnUsage(){let base=({'Sveter':430,'Kardigán':510,'Top':220,'Doplnok':160,'Šaty':630,'Iné':330}[custom.type]||330);let fit=custom.fit==='Oversized'?1.20:custom.fit==='Voľný'?1.08:1;let length=Math.max(.7,Math.min(1.55,custom.length/defaultLength[custom.type]));let knit=[0,.78,.88,1,1.16,1.35][custom.knit]||1;let sleeve=custom.type==='Doplnok'?1:Math.max(.85,Math.min(1.2,custom.sleeve/58));return Math.round(base*sizeFactor(custom.size)*fit*length*knit*sleeve/10)*10}
function estimate(){const base=customPrices[custom.type]||150;return Math.round((base*sizeFactor(custom.size)+(custom.fit==='Oversized'?30:0)+(custom.material==='Prémiová zmes'?35:0)+(custom.knit-3)*12+(custom.length-defaultLength[custom.type])*1.35)/5)*5}
function choices(k,opts){return `<div class="options" role="group" aria-label="${k}">${opts.map(x=>`<button type="button" aria-pressed="${custom[k]===x}" class="option ${custom[k]===x?'active':''}" onclick="choose('${k}','${esc(x)}')">${esc(x)}</button>`).join('')}</div>`}
function keepFields(){let form=document.querySelector('#customForm');if(!form)return null;let keys=['name','email','measurements','note','budget','privacy'];let vals={};for(let k of keys){const el=form.elements.namedItem(k);if(el)vals[k]=el.type==='checkbox'?el.checked:el.value}return vals}
function restoreFields(vals){if(!vals)return;const form=document.querySelector('#customForm');if(!form)return;for(const [k,v] of Object.entries(vals)){let el=form.elements.namedItem(k);if(el){if(el.type==='checkbox')el.checked=!!v;else el.value=v}}}
function choose(k,v){const vals=keepFields();custom[k]=v;if(k==='type'){if(comboNames.includes(custom.color)&&!['Kardigán','Sveter'].includes(v))custom.color='Krémová';custom.length=defaultLength[v]||62;if(v==='Kardigán')custom.closure='Gombíky';if(v!=='Kardigán')custom.closure='Bez zapínania';if(v==='Top')custom.neckline='Okrúhly';if(v==='Doplnok'){custom.texture='Rebro';custom.length=45;}if(v==='Šaty')custom.neckline='Výstrih do V';}render();restoreFields(vals);if(view==='custom')document.getElementById('configStart')?.scrollIntoView({block:'nearest'})}
function setSlider(k,v){custom[k]=Number(v);updateCustomPreview()}
function yarnGraphic(){const grams=yarnUsage(),count=Math.min(5,Math.ceil(grams/150));let circles='';for(let i=0;i<count;i++){let radius=17+Math.round((sizeFactor(custom.size)-.78)*18)+(custom.knit-1)*2;let x=28+i*45;circles+=`<g transform="translate(${x} 43)"><ellipse rx="${radius+2}" ry="${radius*.83}" fill="${comboColors[custom.color]}" stroke="#453b34" stroke-opacity=".12"/><path d="M -${radius*.75} -8 Q 0 -${radius*.9} ${radius*.72} 7 M -${radius*.7} 7 Q 0 ${radius*.95} ${radius*.6} -6 M -${radius*.35} -${radius*.6} Q ${radius*.8} 0 -${radius*.25} ${radius*.65}" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.6"/></g>`}return `<svg viewBox="0 0 260 90" role="img" aria-label="${count} ilustrovaných klbiek priadze" style="width:100%;max-height:85px">${circles}</svg>`}
function svgModel(){let c=comboColors[custom.color]||'#632431',size=sizeFactor(custom.size),width=120*size*(custom.fit==='Oversized'?1.14:custom.fit==='Voľný'?1.06:1),x=180-width/2,length=Math.max(92,Math.min(215,custom.length*1.78)),sleeve=Math.max(65,Math.min(145,custom.sleeve*1.7));let type=custom.type,card=type==='Kardigán',dress=type==='Šaty',top=type==='Top',access=type==='Doplnok';const texture=custom.knit>=4?'knitWide':'knitFine';let topY=106,hem=topY+length,shoulder=topY+22;let body=`<path d="M ${x+13} ${topY} Q ${x+width/2} ${topY+18} ${x+width-13} ${topY} L ${x+width} ${hem-12} Q ${x+width/2} ${hem+9} ${x} ${hem-12} Z" fill="${c}" stroke="#493a34" stroke-opacity=".35" stroke-width="1.2"/>`;let arms=`<path d="M ${x+14} ${shoulder} Q ${x-10} ${shoulder+6} ${x-20} ${shoulder+39} L ${x-35} ${shoulder+sleeve} Q ${x-17} ${shoulder+sleeve+14} ${x+1} ${shoulder+sleeve+4} L ${x+32} ${shoulder+12} Z" fill="${c}" stroke="#493a34" stroke-opacity=".25"/><path d="M ${x+width-14} ${shoulder} Q ${x+width+10} ${shoulder+6} ${x+width+20} ${shoulder+39} L ${x+width+35} ${shoulder+sleeve} Q ${x+width+17} ${shoulder+sleeve+14} ${x+width-1} ${shoulder+sleeve+4} L ${x+width-32} ${shoulder+12} Z" fill="${c}" stroke="#493a34" stroke-opacity=".25"/>`;let opening=card?`<path d="M 168 117 L 168 ${hem} L 179 ${hem} L 179 135 L 190 117" fill="#e8d7c5" stroke="#b7a58e" stroke-width="1.5"/><path d="M 180 138 V ${hem-7}" stroke="${c}" stroke-width="9"/>${[160,189,218,247].filter(y=>y<hem-10).map(y=>`<circle cx="185" cy="${y}" r="3.4" fill="#e2cdb0" stroke="#8a765d" stroke-width="1"/>`).join('')}`:'';let extra=dress?`<path d="M ${x+6} ${topY+90} L ${x-34} ${Math.min(hem+48,337)} Q 180 ${Math.min(hem+65,350)} ${x+width+34} ${Math.min(hem+48,337)} L ${x+width-6} ${topY+90} Z" fill="${c}" stroke="#493a34" stroke-opacity=".25"/>`:'';let bottom=top?`<path d="M ${x} ${Math.min(hem,193)} H ${x+width}" stroke="#d8c4ae" stroke-width="7"/>`:'';let accessory=access?`<path d="M 116 151 Q 180 110 244 151 L 231 256 Q 180 287 129 256 Z" fill="${c}"/><path d="M 137 147 Q 180 174 223 147" fill="none" stroke="#f0e3d2" stroke-width="12"/>`:'';let bodyAndArms=access?accessory:arms+body+extra+opening+bottom;return `<svg viewBox="0 0 360 370" aria-label="Ilustračný model ${esc(type)} ${esc(custom.color)} vo veľkosti ${esc(custom.size)}" role="img" style="width:100%;height:100%;max-height:370px"><defs><pattern id="knitFine" width="8" height="10" patternUnits="userSpaceOnUse"><path d="M1 1 Q4 5 1 9 M5 1 Q8 5 5 9" stroke="#fff" stroke-width=".9" opacity=".24" fill="none"/></pattern><pattern id="knitWide" width="13" height="15" patternUnits="userSpaceOnUse"><path d="M2 0 Q7 8 2 15 M8 0 Q13 8 8 15" stroke="#fff" stroke-width="1.6" opacity=".33" fill="none"/></pattern></defs><ellipse cx="180" cy="349" rx="110" ry="11" fill="#6d5441" opacity=".13"/><path d="M 135 295 L 135 342 L 163 342 L 170 275 M 190 275 L 197 342 L 225 342 L 225 295" fill="#d3b99e" stroke="#bba188" stroke-width="1"/><path d="M 127 325 L 164 325 L 166 341 L 120 341 Z M 194 325 L 232 325 L 240 341 L 194 341 Z" fill="#554841"/><path d="M 165 70 L 165 107 L 195 107 L 195 70 Z" fill="#d3b99e"/><ellipse cx="180" cy="55" rx="38" ry="46" fill="#d6bca1"/><path d="M142 42 Q148 -9 185 9 Q223 3 218 48 Q207 32 195 26 Q175 46 142 42" fill="#3b342f"/><path d="M 142 60 Q142 98 163 106 M218 60 Q218 98 197 106" fill="none" stroke="#d2b49a" stroke-width="8"/><g>${bodyAndArms}</g><g mask="none"><path d="M 70 95 H290 V345 H70Z" fill="url(#${texture})" style="mix-blend-mode:soft-light" pointer-events="none"/></g><path d="M ${x+width/2-14} 109 Q 180 125 ${x+width/2+14} 109" stroke="#e8d4bb" stroke-width="4" fill="none" opacity=".8"/></svg>`}
function previewAsset(){if(generatedCombos[custom.color]&&['Kardigán','Sveter'].includes(custom.type))return generatedCombos[custom.color];const type=['Sveter','Kardigán','Top','Doplnok'].includes(custom.type)?custom.type:'Sveter';return imageAssets.variants[type][custom.color]||imageAssets.variants[type]['Krémová']}
function detailTags(){const tags=[custom.size,custom.fit,custom.material,custom.neckline];if(custom.type==='Kardigán')tags.push(custom.closure);tags.push(custom.texture);return tags.filter(Boolean).map(t=>`<span class="chip-mini">${esc(t)}</span>`).join('')}
function customPreview(){return `<div class="preview-head"><div class="eyebrow">NEPÁR / CUSTOM ATELIÉR</div><h2 id="previewName">${esc(custom.type)}</h2><div class="note" id="previewMeta">${esc(custom.material)} · ${esc(custom.fit)} · ${esc(custom.size)}</div></div><div class="fashion-figure"><div class="preview-photo-wrap"><div class="preview-badge">Vizuálny návrh / AI referencia</div><img class="preview-photo" id="previewPhoto" src="${previewAsset()}" alt="Náhľad custom kúsku NEPÁR"><div class="preview-chips">${detailTags()}</div></div></div><div class="preview-footer"><div><small>FARBA / KOMBINÁCIA</small><strong id="previewColor">${esc(custom.color)}</strong></div><div style="text-align:right"><small>ORIENTAČNÁ CENA OD</small><strong id="previewPrice">${euro(estimate())}</strong></div></div><div class="yarn-panel"><div class="yarn-title"><span>🧶 Odhad spotreby priadze</span><strong id="yarnGrams">≈ ${yarnUsage()} g</strong></div><div id="yarnPreview">${yarnGraphic()}</div><div class="custom-note-card">Ilustračná fotografia vytvorená AI — nie je to vyrobený kus. Farebnosť a detaily sú orientačné; skutočný produkt si spolu odsúhlasíme pred výrobou.</div></div>`}
function updateCustomPreview(){if(view!=='custom')return;const el=id=>document.getElementById(id);if(el('customVisual'))el('customVisual').innerHTML=customPreview();for(const [key,id,suffix] of [['length','lengthValue',' cm'],['sleeve','sleeveValue',' cm']])if(el(id))el(id).textContent=custom[key]+suffix;if(el('knitValue'))el('knitValue').textContent=knitLabel(custom.knit);if(el('summaryPrice'))el('summaryPrice').textContent=euro(estimate());if(el('yarnGrams'))el('yarnGrams').textContent='≈ '+yarnUsage()+' g'}
function sliderControl(key,label,min,max,step,unit){return `<div class="slider-card"><div class="slider-row"><label for="slider-${key}">${label}</label><strong class="slider-value" id="${key==='length'?'lengthValue':key==='sleeve'?'sleeveValue':'knitValue'}">${key==='knit'?knitLabel(custom.knit):custom[key]+unit}</strong></div><input id="slider-${key}" type="range" min="${min}" max="${max}" step="${step}" value="${custom[key]}" oninput="setSlider('${key}',this.value)" aria-label="${label}"><div class="slider-endpoints"><span>${key==='knit'?'Jemný':min+unit}</span><span>${key==='knit'?'Chunky':max+unit}</span></div></div>`}
function customPage(){const necklineChoices=custom.type==='Šaty'?['Výstrih do V','Okrúhly','Širší výstrih']:(custom.type==='Top'?['Okrúhly','Vyšší krk','Jemný výstrih do V']:['Okrúhly','Výstrih do V','Vyšší golier']);const textureChoices=['Čistý úplet','Rebro','Chunky vzor','Otvorená štruktúra'];return `<main class="page"><div class="container custom-container"><div class="page-title"><div class="eyebrow">NEPÁR · MADE JUST FOR YOU</div><h1>Vyskladaj si svoj kúsok.</h1><p class="muted" style="max-width:670px">Vyber typ, farbu, veľkosť a detaily. Naľavo sa zobrazuje fotografia vybraného farebného návrhu. Kombinácie majú vlastné vygenerované zábery, nie farebné filtre. Rozmery si nastavíš nižšie; nejde o presný 3D model.</p></div><div class="custom-wrap"><section class="custom-preview" id="customVisual" aria-live="polite">${customPreview()}</section><form class="form-card" id="customForm" onsubmit="sendCustom(event)"><div class="config-step" id="configStart"><div class="step-number">01</div><div><h3>Aký kúsok chceš?</h3><p class="note">Najprv si vyber typ. Podľa neho sa zmení odporúčaný náhľad aj ďalšie nastavenia.</p></div></div><div class="form-group">${choices('type',['Sveter','Kardigán','Top','Doplnok','Šaty','Iné'])}</div><div class="config-step"><div class="step-number">02</div><div><h3>Farba a materiál</h3><p class="note">Zvoľ jednu farbu alebo niektorú z AI navrhnutých viacfarebných kompozícií.</p></div></div><div class="form-group"><label>Jednofarebné varianty</label><div class="options swatch-options">${Object.entries(colors).map(([n,c])=>`<button type="button" aria-label="Farba: ${n}" aria-pressed="${custom.color===n}" class="color-option ${custom.color===n?'chosen':''}" onclick="choose('color','${n}')"><span class="swatch-dot" style="background:${c}"></span><span>${n}</span></button>`).join('')}</div></div>${['Kardigán','Sveter'].includes(custom.type)?`<div class="form-group"><label>AI farebné kombinácie — vyber si hotový mix</label><div class="combo-grid">${comboNames.map(n=>`<button type="button" class="combo-card ${custom.color===n?'chosen':''}" aria-pressed="${custom.color===n}" onclick="choose('color','${n}')"><img loading="lazy" src="${generatedCombos[n]}" alt="${n} – ručne pletený farebný model"><span class="combo-caption">${n}</span><span class="combo-swatches">${comboPalettes[n].map(c=>`<i style="background:${c}"></i>`).join('')}</span></button>`).join('')}</div><p class="note">Každý mix má vlastnú AI fotografiu skutočne vyzerajúceho úpletu. Slúži ako návrh, nie fotografia už vyrobeného kusu.</p></div>`:''}<div class="form-group"><label>Materiál</label>${choices('material',['Vlna','Bavlna / ľan','Prémiová zmes','Poradíte mi'])}</div><div class="config-step"><div class="step-number">03</div><div><h3>Silueta a detaily</h3><p class="note">Tu si nastavíš charakter kúsku — strih, výstrih a prípadne zapínanie.</p></div></div><div class="form-group"><label>Veľkosť</label>${choices('size',['XS','S','M','L','XL','Na mieru'])}</div><div class="form-group"><label>Strih</label>${choices('fit',['Klasický','Voľný','Oversized'])}</div><div class="form-group"><label>${custom.type==='Doplnok'?'Typ lemu':'Výstrih / horné ukončenie'}</label>${choices('neckline',necklineChoices)}</div>${custom.type==='Kardigán'?`<div class="form-group"><label>Zapínanie</label>${choices('closure',['Gombíky','Bez zapínania','Viazanie'])}</div>`:''}<div class="form-group"><label>Štruktúra / vzor</label>${choices('texture',textureChoices)}</div><div class="config-step"><div class="step-number">04</div><div><h3>Rozmery a úplet</h3><p class="note">Slidery používaj na doladenie dĺžok a hrúbky úpletu.</p></div></div>${sliderControl('length','Dĺžka kúsku',42,110,1,' cm')}${custom.type==='Doplnok'?'':sliderControl('sleeve','Dĺžka rukávov',40,76,1,' cm')}${sliderControl('knit','Hrúbka úpletu',1,5,1,'')}<div class="config-step"><div class="step-number">05</div><div><h3>Pošli nám svoju predstavu</h3><p class="note">Nezáväzný dopyt. Finálnu cenu a termín vždy potvrdíme ručne.</p></div></div><div class="admin-grid"><div class="form-group"><label for="cName">Meno *</label><input id="cName" name="name" required autocomplete="name" placeholder="Tvoje meno"></div><div class="form-group"><label for="cEmail">E-mail *</label><input id="cEmail" name="email" type="email" autocomplete="email" required placeholder="meno@email.sk"></div></div><div class="form-group"><label for="cSize">Výška a rozmery (nepovinné)</label><input id="cSize" name="measurements" placeholder="Napr. výška 175 cm, hrudník 95 cm"></div><div class="form-group"><label for="cNote">Poznámka k návrhu *</label><textarea id="cNote" name="note" required placeholder="Vzor, inšpirácia, konkrétne úpravy…"></textarea></div><div class="form-group"><label for="cBudget">Rozpočet</label><select name="budget" id="cBudget"><option value="">Nemám stanovený</option><option>Do 150 €</option><option>150–250 €</option><option>250–400 €</option><option>400 € a viac</option></select></div><label class="fieldcheck"><input type="checkbox" required name="privacy"><span>Berem na vedomie, že údaje budú použité na odpoveď na môj dopyt. *</span></label><div class="summary"><div class="mini-flex"><b>Orientačne od</b><b id="summaryPrice">${euro(estimate())}</b></div><p class="note">Toto je ilustračný AI náhľad a orientačné nastavenie parametrov. Finálne odsúhlasenie materiálu, ceny a času výroby prebehne osobne.</p></div><button class="btn" type="submit" style="width:100%;padding:17px">Odoslať nezáväzný dopyt →</button></form></div></div></main>`}
function orderId(){return 'NP-'+new Date().toISOString().slice(0,10).replaceAll('-','')+'-'+Math.random().toString(36).slice(2,6).toUpperCase()}
function mailDraft(subject,body){const mail=(db.settings.email||'').trim();if(mail)window.location.href=`mailto:${encodeURIComponent(mail)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;else alertToast('Dopyt uložený lokálne. V Ateliéri nastavte kontaktný e-mail pre odosielanie.');}
function sendCustom(e){e.preventDefault();let f=new FormData(e.target);let o={id:orderId(),kind:'custom',created:new Date().toLocaleString('sk-SK'),status:'Nová',name:String(f.get('name')).trim(),email:String(f.get('email')).trim(),type:custom.type,color:custom.color,material:custom.material,size:custom.size,fit:custom.fit,neckline:custom.neckline,closure:custom.closure,texture:custom.texture,length:custom.length,sleeve:custom.sleeve,knit:custom.knit,yarnGrams:yarnUsage(),measurements:String(f.get('measurements')||''),note:String(f.get('note')).trim(),budget:String(f.get('budget')||''),estimate:estimate()};db.orders.unshift(o);save();mailDraft('NEPÁR custom dopyt '+o.id,`Číslo: ${o.id}\nMeno: ${o.name}\nKontakt: ${o.email}\nTyp: ${o.type}\nFarba: ${o.color}\nMateriál: ${o.material}\nVeľkosť: ${o.size}\nStrih: ${o.fit}\nDĺžka kúsku: ${o.length} cm\nDĺžka rukáva: ${o.sleeve} cm\nVýstrih / horné ukončenie: ${o.neckline}\nZapínanie: ${o.closure}\nŠtruktúra: ${o.texture}\nHrúbka úpletu: ${knitLabel(o.knit)}\nOrientačná spotreba: ${o.yarnGrams} g\nRozmery: ${o.measurements}\nPoznámka: ${o.note}\nRozpočet: ${o.budget}\nOrientačne od: ${o.estimate} €`);go('thanks')}
function cartPage(){let items=db.cart.map(c=>({...c,p:db.products.find(p=>p.id===c.id)})).filter(c=>c.p);let sum=items.reduce((a,c)=>a+c.quantity*c.p.price,0);return `<main class="page"><div class="container section"><h1>Tvoj košík</h1>${!items.length?`<div class="empty">Košík je prázdny.<p><button class="btn" onclick="go('shop')">Pozrieť drop</button></p></div>`:`<div style="max-width:780px">${items.map(c=>`<div class="mini-flex" style="padding:18px 0;border-bottom:1px solid var(--line)"><div><b>${esc(c.p.name)}</b><div class="muted">${c.quantity} × ${euro(c.p.price)}</div></div><div><b>${euro(c.quantity*c.p.price)}</b> <button class="btn secondary small" onclick="removeCart('${c.id}')">Odstrániť</button></div></div>`).join('')}<div class="mini-flex" style="margin:24px 0"><b>Spolu bez dopravy</b><h3>${euro(sum)}</h3></div><div class="notice">Toto je demo objednávkového procesu. Nie je tu napojená platobná brána ani serverové rezervovanie zásob. Dokončenie pripraví e-mailový dopyt.</div><form class="form-card" onsubmit="sendCart(event)"><h3>Objednávkový dopyt</h3><div class="form-group"><label>Meno *</label><input name="name" required></div><div class="form-group"><label>E-mail *</label><input name="email" type="email" required></div><div class="form-group"><label>Telefón (nepovinné)</label><input name="phone"></div><div class="form-group"><label>Poznámka</label><textarea name="note"></textarea></div><label class="fieldcheck"><input type="checkbox" required> Súhlasím s použitím kontaktných údajov na vybavenie dopytu.</label><button class="btn" type="submit">Odoslať dopyt na tieto kúsky →</button></form></div>`}</div></main>`}
function sendCart(e){e.preventDefault();let f=new FormData(e.target),items=db.cart.map(c=>({...c,p:db.products.find(p=>p.id===c.id)})).filter(c=>c.p),o={id:orderId(),kind:'shop',created:new Date().toLocaleString('sk-SK'),status:'Nová',name:String(f.get('name')).trim(),email:String(f.get('email')).trim(),phone:String(f.get('phone')||''),note:String(f.get('note')||''),items:items.map(c=>({name:c.p.name,quantity:c.quantity,price:c.p.price})),total:items.reduce((s,c)=>s+c.quantity*c.p.price,0)};db.orders.unshift(o);save();mailDraft('NEPÁR záujem o kúsky '+o.id,`Číslo: ${o.id}\nMeno: ${o.name}\nE-mail: ${o.email}\nTelefón: ${o.phone}\nProdukty:\n${o.items.map(i=>i.name+' × '+i.quantity+' / '+i.price+' €').join('\n')}\nSpolu: ${o.total} €\nPoznámka: ${o.note}`);db.cart=[];save();go('thanks')}
function thanks(){return `<main class="page"><div class="container section" style="max-width:760px;text-align:center"><div style="font-size:64px">✳</div><h1>Ďakujeme za záujem.</h1><p>Požiadavku sme uložili <b>do tejto prehliadačovej ukážky</b>. ${db.settings.email?'Ak sa otvoril e-mailový klient, dopyt je potrebné ešte odoslať e-mailom.':'Ateliér zatiaľ nemá nastavenú kontaktnú e-mailovú adresu, takže dopyt sa automaticky nikam neposlal.'}</p><p class="muted">Pre ostrú prevádzku bude potrebné online úložisko a doručovanie objednávok.</p><button class="btn" onclick="go('home')">Späť na úvod</button></div></main>`}
function openContact(){const email=db.settings.email;if(email)window.location.href='mailto:'+encodeURIComponent(email)+'?subject='+encodeURIComponent('NEPÁR – zaujímajú ma ďalšie dropy');else alertToast('Prihlásenie do newslettera si vyžiada napojenie e-mailovej služby.');}
function admin(){if(!sessionStorage.getItem(ADMIN_KEY))return `<main class="page"><div class="container section" style="max-width:600px"><div class="eyebrow">Studio / Demo administrácia</div><h1>Ateliér NEPÁR</h1><div class="notice">Toto je lokálny prototyp. Prístupový kód neslúži ako bezpečné prihlasovanie. Pre verejný web bude potrebné serverové overovanie účtu.</div><form class="form-card" onsubmit="adminLogin(event)"><div class="form-group"><label>Demo prístupový kód</label><input name="code" type="password" required placeholder="Zadaj demo kód"></div><button class="btn">Vstúpiť do ateliéru →</button><p class="note">Demo kód: <span class="code">NEPAR2027</span></p></form></div></main>`;return `<main class="page"><div class="container"><div class="page-title"><div class="eyebrow">Interný priestor · demo</div><h1>Ateliér</h1><p class="muted">Produkty, dropy, dopyty a nastavenia. Všetky zmeny sa ukladajú len v tomto zariadení.</p></div><div class="layout-admin"><aside class="admin-menu">${[['products','Produkty'],['orders','Dopyty'],['drop','Aktuálny drop'],['settings','Nastavenia']].map(([v,n])=>`<button class="btn ${adminTab===v?'':'secondary'}" onclick="adminTab='${v}';render()">${n}</button>`).join('')}<button class="btn secondary" onclick="exportData()">Exportovať dáta ↓</button><button class="btn secondary" onclick="document.getElementById('importFile').click()">Importovať dáta ↑</button><input id="importFile" type="file" accept="application/json" hidden onchange="importData(event)"><button class="btn secondary" onclick="sessionStorage.removeItem(ADMIN_KEY);render()">Odhlásiť sa</button></aside><section class="admin-panel">${adminTab==='products'?adminProducts():adminTab==='orders'?adminOrders():adminTab==='drop'?adminDrop():adminSettings()}</section></div></div></main>`}
function adminLogin(e){e.preventDefault();if(new FormData(e.target).get('code')==='NEPAR2027'){sessionStorage.setItem(ADMIN_KEY,'1');render()}else alertToast('Nesprávny demo kód.')}function adminProducts(){return `<div class="section-head"><div><h3>Produkty (${db.products.length})</h3><p class="muted">Pridávaj nové kúsky do e-shopu.</p></div><button class="btn" onclick="productForm()">+ Nový produkt</button></div><div style="overflow:auto"><table class="admin-table"><thead><tr><th>Model</th><th>Kategória</th><th>Cena</th><th>Kusy</th><th>Akcia</th></tr></thead><tbody>${db.products.map(p=>`<tr><td><b>${esc(p.name)}</b><br><span class="muted">${esc(p.drop)}</span></td><td>${esc(p.category)}</td><td>${euro(p.price)}</td><td>${p.stock}</td><td><button class="btn secondary small" onclick="productForm('${esc(p.id)}')">Upraviť</button><button class="btn secondary small" onclick="deleteProduct('${esc(p.id)}')">Zmazať</button></td></tr>`).join('')}</tbody></table></div>`}
function productForm(id){const p=db.products.find(x=>x.id===id)||{id:'',name:'',category:'Sveter',price:'',stock:1,drop:db.drop.name,material:'',origin:'',maker:'',hours:'',color:'',image:'',description:''};editing=id||null;const dialog=document.createElement('div');dialog.className='modal-bg';dialog.id='productModal';dialog.innerHTML=`<div class="modal"><button class="close" type="button" onclick="closeModal()">×</button><h3>${id?'Upraviť produkt':'Nový produkt'}</h3><form onsubmit="saveProduct(event)"><div class="admin-grid"><div class="form-group"><label>Názov *</label><input name="name" required value="${esc(p.name)}"></div><div class="form-group"><label>Kategória</label><select name="category">${['Sveter','Kardigán','Top','Doplnok','Šaty','Iné'].map(x=>`<option ${p.category===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="form-group"><label>Cena v € *</label><input name="price" type="number" min="0" step="0.01" required value="${esc(p.price)}"></div><div class="form-group"><label>Počet kusov *</label><input name="stock" type="number" min="0" step="1" required value="${esc(p.stock)}"></div><div class="form-group"><label>Farba</label><input name="color" value="${esc(p.color)}"></div><div class="form-group"><label>Hodiny práce</label><input name="hours" type="number" min="0" step="0.5" value="${esc(p.hours)}"></div></div><div class="form-group"><label>Edícia</label><input name="drop" value="${esc(p.drop)}"></div><div class="form-group"><label>Materiál a presné zloženie</label><input name="material" value="${esc(p.material)}"></div><div class="form-group"><label>Pôvod materiálu</label><input name="origin" value="${esc(p.origin)}"></div><div class="form-group"><label>Kto vyrobil</label><input name="maker" value="${esc(p.maker)}"></div><div class="form-group"><label>URL fotky</label><input name="image" type="url" value="${esc(p.image)}" placeholder="https://..."></div><div class="form-group"><label>Alebo nahraj fotku zo zariadenia (max 1 MB)</label><input id="uploadImage" type="file" accept="image/*"></div><div class="form-group"><label>Popis</label><textarea name="description">${esc(p.description)}</textarea></div><button class="btn" type="submit">Uložiť produkt</button></form></div>`;document.body.appendChild(dialog)}
function closeModal(){document.getElementById('productModal')?.remove()}
async function saveProduct(e){e.preventDefault();const f=new FormData(e.target);let old=db.products.find(p=>p.id===editing);let image=String(f.get('image')||'');let file=document.getElementById('uploadImage').files[0];if(file){if(file.size>1000000){alertToast('Fotka je príliš veľká pre lokálne uloženie (max 1 MB).');return}image=await new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}let p={id:editing||'p'+Date.now(),name:String(f.get('name')),category:String(f.get('category')),price:Number(f.get('price')),stock:Number(f.get('stock')),color:String(f.get('color')),hours:Number(f.get('hours')||0),drop:String(f.get('drop')),material:String(f.get('material')),origin:String(f.get('origin')),maker:String(f.get('maker')),image,description:String(f.get('description'))};if(old)Object.assign(old,p);else db.products.unshift(p);try{save()}catch(e){alertToast('Úložisko je plné. Použi menšiu fotku alebo URL obrázka.');return}closeModal();render();alertToast('Produkt uložený.')}function deleteProduct(id){if(confirm('Naozaj chceš odstrániť produkt?')){db.products=db.products.filter(p=>p.id!==id);db.cart=db.cart.filter(c=>c.id!==id);save();render()}}
function adminOrders(){return `<h3>Dopyty (${db.orders.length})</h3><p class="muted">Len dopyty vytvorené v tomto prehliadači. V reálnej prevádzke musí byť spoločná databáza.</p>${!db.orders.length?'<div class="empty">Zatiaľ žiadne dopyty.</div>':`<div style="overflow:auto"><table class="admin-table"><thead><tr><th>Číslo / dátum</th><th>Kontakt</th><th>Obsah</th><th>Stav</th></tr></thead><tbody>${db.orders.map(o=>`<tr><td><b>${esc(o.id)}</b><br>${esc(o.created)}</td><td>${esc(o.name)}<br><a href="mailto:${encodeURIComponent(o.email)}">${esc(o.email)}</a></td><td>${o.kind==='custom'?`<b>Custom ${esc(o.type)}</b><br>${esc(o.color)} / ${esc(o.size)} / ${esc(o.material)}<br>${o.neckline?esc(o.neckline):''}${o.closure&&o.type==='Kardigán'?' · '+esc(o.closure):''}${o.texture?'<br>'+esc(o.texture):''}<br>${o.length?esc(String(o.length))+' cm':''}${o.length&&o.sleeve&&o.type!=='Doplnok'?' · ':''}${o.sleeve&&o.type!=='Doplnok'?esc(String(o.sleeve))+' cm rukáv':''}${o.knit?'<br>Úplet: '+esc(knitLabel(o.knit)):''}<br>${esc(o.note)}<br>Od ${euro(o.estimate)}`:`<b>Produkty</b><br>${(o.items||[]).map(i=>esc(i.name)+' × '+i.quantity).join('<br>')}<br>${euro(o.total)}`}</td><td><select onchange="setOrderStatus('${esc(o.id)}',this.value)">${['Nová','Kontaktovaný','Potvrdená','Vo výrobe','Hotová','Zrušená'].map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div>`}`}
function setOrderStatus(id,status){let o=db.orders.find(x=>x.id===id);if(o){o.status=status;save();alertToast('Stav dopytu uložený.')}}
function adminDrop(){return `<h3>Aktuálny drop</h3><p class="muted">Zmeny sa premietnu na domovskej stránke.</p><form onsubmit="saveDrop(event)"><div class="form-group"><label>Názov edície</label><input name="name" required value="${esc(db.drop.name)}"></div><div class="form-group"><label>Popis dropu</label><textarea name="desc">${esc(db.drop.desc)}</textarea></div><div class="form-group"><label>Dátum spustenia</label><input name="date" type="date" value="${esc(db.drop.date)}"></div><button class="btn">Uložiť drop</button></form>`}
function saveDrop(e){e.preventDefault();const f=new FormData(e.target);db.drop={...db.drop,name:String(f.get('name')),desc:String(f.get('desc')),date:String(f.get('date'))};save();render();alertToast('Drop aktualizovaný.')}
function adminSettings(){return `<h3>Nastavenia</h3><form onsubmit="saveSettings(event)"><div class="form-group"><label>Váš kontaktný e-mail pre dopyty *</label><input type="email" name="email" value="${esc(db.settings.email)}" placeholder="atelier@vasadomena.sk" required></div><p class="note">E-mail sa použije na otvorenie poštového klienta zákazníka s predvyplneným dopytom. Nejde o automatické odoslanie.</p><div class="form-group"><label>Instagram</label><input name="instagram" value="${esc(db.settings.instagram)}" placeholder="@nepar"></div><button class="btn">Uložiť nastavenia</button></form><div class="notice">Demo prístupový kód je viditeľný v zdrojovom kóde. Nikdy ho nepoužívajte na skutočnom verejnom e-shope. Na to je potrebná autentifikácia a server.</div><button class="btn secondary small" onclick="resetDemo()">Obnoviť demo dáta</button>`}
function saveSettings(e){e.preventDefault();let f=new FormData(e.target);db.settings.email=String(f.get('email')).trim();db.settings.instagram=String(f.get('instagram')).trim();save();render();alertToast('Nastavenia uložené.')}function resetDemo(){if(confirm('Vymazať všetky lokálne produkty, dopyty a nastavenia a obnoviť ukážku?')){db=fresh();save();render()}}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='nepar-data-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function importData(e){let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d.products)||!Array.isArray(d.orders))throw Error('Neplatný formát');if(!confirm('Import nahradí všetky lokálne údaje. Pokračovať?'))return;db={...fresh(),...d};save();render();alertToast('Údaje importované.')}catch(err){alertToast('Nepodarilo sa importovať súbor JSON.')}}
function render(){const pages={home,shop,detail,about,passport,custom:customPage,cart:cartPage,thanks,admin};document.getElementById('app').innerHTML=nav()+(pages[view]||home)()+foot()}render();
</script></body></html>
